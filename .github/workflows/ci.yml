name: CI

# What runs here, and how to run each piece yourself (pip install -e '.[dev]' first):
#   lint   ruff check . ; python scripts/secrets-audit.py
#   test   pytest            (tests/live skips; run it with --run-live, see CLAUDE.md)
#   smoke  bash scripts/smoke.sh
# GitHub-hosted runners: this repository is public, so they cost no minutes, and a
# self-hosted runner on a public repository would run any fork's pull request.
# Each job names its Ubuntu release rather than ubuntu-latest: moving to a new
# release is a change of its own, made here when it is wanted.

on:
  push:
    branches: [master, main]
  pull_request:

# The token every job gets can read the code and nothing else, so a step or a
# dependency gone bad cannot push to the repository.
permissions:
  contents: read

concurrency:
  # A newer push to a pull request makes the older run moot. Every commit to
  # master keeps its own run, so a failure there stays pinned to one commit.
  group: ${{ github.workflow }}-${{ github.ref_name == 'master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: Secrets and machine-specific strings
        env:
          # Host and user names to refuse, one regex per line. Kept in a repository
          # secret because writing them here would publish them; empty on forks.
          SECRETS_AUDIT_PATTERNS: ${{ secrets.SECRETS_AUDIT_PATTERNS }}
        run: python scripts/secrets-audit.py

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml admits, and the one the board's venv runs.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      # Search shells out to rg, and tests/test_search.py skips without it.
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep
      # tests/conftest.py points HOME at an empty temporary directory for the run.
      - name: pytest
        run: python -m pytest -ra

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      # Boots the board on seeded demo data, checks the API, and renders the page
      # in the runner's Chrome.
      - name: Board starts, serves and renders
        run: bash scripts/smoke.sh
