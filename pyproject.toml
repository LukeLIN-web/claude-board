[project]
name = "claude-fleet"
version = "0.1.0"
description = "Local web dashboard for multi-window Claude Code orchestration"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "watchfiles>=0.24",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# What CI installs, and what to install before running the checks yourself:
#   pip install -e '.[dev]'
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# hydra ships a pytest plugin, and something in this venv installed hydra without
# pyyaml — so autoloading it crashes `pytest` before a single test is collected.
# Nothing here uses hydra; skip it rather than carry an unrelated dependency.
addopts = "-p no:hydra_pytest"
markers = [
    "live: drives a real Claude Code session on haiku; skipped unless --run-live (tests/live)",
]
# A ceiling on any one test, so a wait on tmux or a pane that never comes fails
# that test instead of hanging the run. Live tests set their own.
timeout = 60

[tool.ruff]
target-version = "py310"
extend-exclude = ["fixtures/demo-home"]

[tool.ruff.lint]
# Pyflakes-level only: undefined and unused names, redefinitions, syntax errors.
# No formatter and no style rules, so CI never asks to reflow working code.
select = ["F", "E9"]
